name: mimic_ui
description: Desktop UI for mimic — record your screen, get working code.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  file_picker: ^8.0.0
  window_manager: ^0.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/
