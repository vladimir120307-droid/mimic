<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mimic — generated</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
  'primary': '#6E56CF',
  'surface': '#F8FAFC',
  'on_surface': '#0F172A',
  'background': '#F8FAFC'
} } }
    };
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body class="min-h-screen bg-background text-on-surface antialiased">

<main class="mx-auto max-w-md">
<section id="login" class="screen active min-h-screen" style="background-color: #F8FAFC">
  <div data-mimic-id="login_root" class="flex flex-col gap-2 bg-background p-6">
    <span data-mimic-id="logo" class="text-primary text-5xl">●</span>
    <p data-mimic-id="title" class="text-3xl font-bold text-center">Welcome back</p>
    <p data-mimic-id="subtitle" class="text-[#64748B] text-sm text-center">Sign in to continue to your dashboard</p>
    <input data-mimic-id="email_field" type="text" placeholder="Email address" class=" w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-violet-500" />
    <input data-mimic-id="password_field" type="text" placeholder="Password" class=" w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-violet-500" />
    <button data-mimic-id="sign_in_button" class="bg-primary text-[#FFFFFF]" type="button">Sign in</button>
    <p data-mimic-id="signup_hint" class="text-primary text-sm text-center">Don&#x27;t have an account? Create one</p>
  </div>
</section>
</main>

</body>
</html>
