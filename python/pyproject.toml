[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mimic-cli"
version         = "0.1.0"
description     = "Turn screen recordings and screenshots into working Flutter / HTML / React code"
readme          = "README.md"
license         = { file = "../LICENSE" }
requires-python = ">=3.10"
keywords        = ["screen-to-code", "screenshot-to-code", "flutter", "code-generation", "vision-llm"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "anthropic>=0.34",
    "openai>=1.40",
    "pydantic>=2.5",
    "pillow>=10.0",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
    "mss>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pillow",
    "pybind11>=2.12",
    "pybind11-stubgen>=2.5",
]
local = [
    "transformers>=4.40",
    "torch>=2.2",
]

[project.scripts]
mimic = "mimic.cli:app"

[project.urls]
Homepage      = "https://github.com/Cyber-Lord/mimic"
Repository    = "https://github.com/Cyber-Lord/mimic"
Issues        = "https://github.com/Cyber-Lord/mimic/issues"
Documentation = "https://github.com/Cyber-Lord/mimic/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version       = "3.10"
strict               = true
warn_unused_ignores  = true
warn_return_any      = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths      = ["tests"]
addopts        = "-ra --strict-markers --color=yes"
asyncio_mode   = "auto"
