<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0F0A2A"/>
      <stop offset="100%" stop-color="#1A0F3F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#6E56CF"/>
      <stop offset="100%" stop-color="#1FB6FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <g opacity="0.10" stroke="#FFFFFF" stroke-width="1">
    <line x1="0"   y1="160" x2="1280" y2="160"/>
    <line x1="0"   y1="320" x2="1280" y2="320"/>
    <line x1="0"   y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0"   x2="320"  y2="640"/>
    <line x1="640" y1="0"   x2="640"  y2="640"/>
    <line x1="960" y1="0"   x2="960"  y2="640"/>
  </g>

  <g transform="translate(80, 230)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="800" letter-spacing="-2">mimic</text>
    <text x="0" y="60" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="700">Record your screen → get working code.</text>
    <text x="0" y="120" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500">Flutter · HTML · React · React + TypeScript · Material 3 · Tailwind</text>
    <text x="0" y="180" fill="#6E56CF" font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="20" font-weight="600">pip install mimic-cli</text>
  </g>

  <g transform="translate(820, 130)">
    <rect width="380" height="380" rx="32" fill="#FFFFFF" opacity="0.06"/>
    <rect x="20" y="20" width="340" height="40" rx="6" fill="#6E56CF" opacity="0.8"/>
    <rect x="20" y="80" width="340" height="80" rx="12" fill="#FFFFFF" opacity="0.1"/>
    <rect x="20" y="180" width="160" height="160" rx="12" fill="#FFFFFF" opacity="0.1"/>
    <rect x="200" y="180" width="160" height="160" rx="12" fill="#FFFFFF" opacity="0.1"/>
    <circle cx="320" cy="320" r="24" fill="url(#accent)" filter="url(#glow)" opacity="0.7"/>
    <circle cx="320" cy="320" r="20" fill="url(#accent)"/>
    <text x="312" y="328" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="26" font-weight="700">+</text>
  </g>

  <g transform="translate(80, 540)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" opacity="0.8">github.com/vladimir120307-droid/mimic</text>
    <text x="1100" y="0" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" opacity="0.8" text-anchor="end">MIT · open source</text>
  </g>
</svg>
