<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mimic — generated</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
<nav class="sticky top-0 z-10 bg-white border-b border-slate-200">
  <div class="mx-auto max-w-md flex gap-2 px-4 py-2 overflow-x-auto">
    <button data-target="catalog" class="px-3 py-1 rounded hover:bg-slate-200">Catalog</button>
    <button data-target="product_detail" class="px-3 py-1 rounded hover:bg-slate-200">Product</button>
  </div>
</nav>
<main class="mx-auto max-w-md">
<section id="catalog" class="screen active min-h-screen">
  <div data-mimic-id="catalog_root" class="flex flex-col gap-2 bg-[#F8FAFC]">
    <header data-mimic-id="catalog_app_bar" class="w-full px-4 py-3 flex items-center justify-between bg-[#FFFFFF] text-[#0F172A]">
      Shop
    </header>
    <input data-mimic-id="catalog_search" type="text" placeholder="Search products" class=" w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-violet-500" />
    <div data-mimic-id="catalog_grid" class="relative">
      <article data-mimic-id="prod_0" class="rounded-2xl bg-white shadow-sm p-4 bg-[#FFFFFF] rounded-lg shadow-md p-3">
        <div data-mimic-id="prod_img_0" class="bg-[#E2E8F0] rounded">
        </div>
        <p data-mimic-id="prod_title_0" class="text-sm font-semibold">Linen shirt</p>
        <p data-mimic-id="prod_price_0" class="text-[#E11D48] text-base font-bold">$48</p>
      </article>
      <article data-mimic-id="prod_1" class="rounded-2xl bg-white shadow-sm p-4 bg-[#FFFFFF] rounded-lg shadow-md p-3">
        <div data-mimic-id="prod_img_1" class="bg-[#E2E8F0] rounded">
        </div>
        <p data-mimic-id="prod_title_1" class="text-sm font-semibold">Knit sweater</p>
        <p data-mimic-id="prod_price_1" class="text-[#E11D48] text-base font-bold">$72</p>
      </article>
      <article data-mimic-id="prod_2" class="rounded-2xl bg-white shadow-sm p-4 bg-[#FFFFFF] rounded-lg shadow-md p-3">
        <div data-mimic-id="prod_img_2" class="bg-[#E2E8F0] rounded">
        </div>
        <p data-mimic-id="prod_title_2" class="text-sm font-semibold">Wool coat</p>
        <p data-mimic-id="prod_price_2" class="text-[#E11D48] text-base font-bold">$195</p>
      </article>
      <article data-mimic-id="prod_3" class="rounded-2xl bg-white shadow-sm p-4 bg-[#FFFFFF] rounded-lg shadow-md p-3">
        <div data-mimic-id="prod_img_3" class="bg-[#E2E8F0] rounded">
        </div>
        <p data-mimic-id="prod_title_3" class="text-sm font-semibold">Cotton trousers</p>
        <p data-mimic-id="prod_price_3" class="text-[#E11D48] text-base font-bold">$56</p>
      </article>
    </div>
  </div>
</section>
<section id="product_detail" class="screen min-h-screen">
  <div data-mimic-id="product_detail_root" class="flex flex-col gap-2 bg-[#FFFFFF]">
    <div data-mimic-id="detail_image" class="bg-[#E2E8F0]">
    </div>
    <p data-mimic-id="detail_title" class="text-2xl font-bold">Linen shirt</p>
    <p data-mimic-id="detail_price" class="text-[#E11D48] text-lg">$48</p>
    <p data-mimic-id="detail_desc" class="text-[#64748B] text-sm">Soft, breathable linen with a relaxed cut. Ethically sourced.</p>
    <button data-mimic-id="add_to_cart" class="bg-[#0F172A] text-[#FFFFFF]" type="button">Add to cart</button>
  </div>
</section>
</main>
<script>
(() => {
  const routes = {"prod_0":"product_detail","prod_1":"product_detail","prod_2":"product_detail","prod_3":"product_detail"};
  const show = (id) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  };
  document.querySelectorAll('nav button[data-target]').forEach(btn => {
    btn.addEventListener('click', () => show(btn.dataset.target));
  });
  document.body.addEventListener('click', e => {
    const target = e.target.closest('[data-mimic-id]');
    if (!target) return;
    const dest = routes[target.dataset.mimicId];
    if (dest) show(dest);
  });
})();
</script>
</body>
</html>
