name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"  # weekly Monday 05:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, cpp]
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps (cpp)
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxcb1-dev libxcb-shm0-dev cmake

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build C++ (cpp only)
        if: matrix.language == 'cpp'
        run: |
          cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMIMIC_BUILD_BINDINGS=OFF -DMIMIC_BUILD_TESTS=OFF
          cmake --build native/build --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
