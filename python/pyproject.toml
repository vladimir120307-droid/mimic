[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mimic-cli"
version         = "0.2.0"
description     = "Turn screen recordings and screenshots into working Flutter / HTML / React code"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"
keywords        = ["screen-to-code", "screenshot-to-code", "flutter", "code-generation", "vision-llm"]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "anthropic>=0.34",
    "openai>=1.40",
    "pydantic>=2.5",
    "pillow>=10.0",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
    "mss>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-Pillow",
    "pybind11>=2.12",
    "pybind11-stubgen>=2.5",
]
local = [
    "transformers>=4.40",
    "torch>=2.2",
]

[project.scripts]
mimic = "mimic.cli:app"

[project.urls]
Homepage      = "https://github.com/vladimir120307-droid/mimic"
Repository    = "https://github.com/vladimir120307-droid/mimic"
Issues        = "https://github.com/vladimir120307-droid/mimic/issues"
Documentation = "https://github.com/vladimir120307-droid/mimic/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501  - line length (handled by --line-length, not enforced here)
# E701  - multiple statements on one line (used for aligned guard clauses)
# RUF001- ambiguous unicode (×, ›) — intentional in generated UI strings
# RUF002- ambiguous unicode in docstrings — same reason
# RUF003- ambiguous unicode in comments — Russian text in tests/docs
ignore = ["E501", "E701", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests can shadow built-ins and use longer lines without complaint.
"tests/**" = ["E741", "B007"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version        = "3.10"
strict                = false
warn_unused_ignores   = true
warn_return_any       = false
disallow_untyped_defs = false
# We use strict-ish defaults but allow gradual typing; CI runs `mypy src/mimic`
# which mostly catches obvious shape errors without forcing every helper to
# have explicit signatures.
ignore_missing_imports = true
allow_untyped_globals  = true

[tool.pytest.ini_options]
testpaths      = ["tests"]
addopts        = "-ra --strict-markers --color=yes"
asyncio_mode   = "auto"
